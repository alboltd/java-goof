name: IssueDesk Maven validation

on:
  push:
    branches: [main]
    paths:
      - 'todolist-goof/**'
      - '.github/workflows/issuedesk-maven-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'todolist-goof/**'
      - '.github/workflows/issuedesk-maven-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-struts-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: todolist-goof/pom.xml
      - name: Compile and run tests with the Log4j change
        run: mvn -B -ntp -f todolist-goof/pom.xml -pl todolist-web-struts -am test
      - name: Report resolved Log4j dependencies
        run: mvn -B -ntp -f todolist-goof/pom.xml -pl todolist-web-struts -am dependency:tree -Dincludes=org.apache.logging.log4j
